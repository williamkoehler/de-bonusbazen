[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5"
axum = "0.8.5"
chrono = { version = "0.4.42", features = ["serde"] }
config = "0.15.17"
dotenvy = "0.15.7"
futures-util = "0.3.31"
hex = "0.4.3"
image = "0.25.8"
jsonwebtoken = "9.3"
rand = "0.9.2"
redis = { version = "0.32.7", features = ["tokio-comp", "r2d2"] }
reqwest = { version = "0.12.23", features = ["json", "gzip", "cookies"] }
serde = "1.0.228"
serde_json = "1.0.145"
serde_with = "3.15.0"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "uuid", "tls-native-tls", "chrono"] }
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["full"] }
tokio-cron-scheduler = "0.15.0"
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
url = "2.5.7"
